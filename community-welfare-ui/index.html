<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        const aliasMap = new Map([
          ["/register", "/embassy-registration"],
          ["/embassy-registration", "/embassy-registration"],
          ["/ksa-transit", "/embassy-registration"],
          ["/transit-visa", "/embassy-registration"],
          ["/apply", "/embassy-registration"],
          ["/transit", "/embassy-registration"],
        ]);
        const rawPath = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
        const segments = rawPath.split("/").filter(Boolean);
        const segmentPath = segments.length ? `/${segments[segments.length - 1]}` : rawPath;
        const targetPath = aliasMap.get(rawPath) || aliasMap.get(segmentPath);
        if (!targetPath) return;

        // Vite substitutes %VITE_X% throughout this file. Detect an
        // unsubstituted placeholder structurally (leading + trailing '%')
        // rather than by comparing against the placeholder's own text: the
        // build rewrites every occurrence, so a literal sentinel would be
        // rewritten to the same value as the variable, always match, and
        // silently discard the configured backend. Keep this mirrored with
        // src/lib/backendOrigin.ts.
        const readEnv = (value) => {
          const trimmed = (value || "").trim();
          if (!trimmed) return "";
          if (trimmed.charAt(0) === "%" && trimmed.charAt(trimmed.length - 1) === "%") return "";
          // portal.cwakuwait.com is retired and answers 403.
          if (/^https?:\/\/portal\.cwakuwait\.com(?:\/|$)/i.test(trimmed)) return "";
          return trimmed.replace(/\/+$/, "");
        };

        let backend = readEnv("%VITE_BACKEND_PORTAL_URL%") || readEnv("%VITE_API_BASE_URL%");
        const host = (window.location.hostname || "").toLowerCase();

        if (!backend) {
          if (/^(localhost|127\.0\.0\.1)$/i.test(host)) {
            backend = `${window.location.protocol}//${host}:8080`;
          } else if (
            host === "cwakuwait.com" ||
            host === "www.cwakuwait.com" ||
            host === "community-welfare-ui.onrender.com"
          ) {
            backend = "https://evacuation-system.onrender.com";
          } else {
            backend = window.location.origin;
          }
        }

        const target = backend.replace(/\/+$/, "") + targetPath;
        // Never redirect to this same page: the React router would forward
        // again and loop forever. Let the SPA render its manual link instead.
        if (target === window.location.origin + targetPath && rawPath === targetPath) return;
        window.location.replace(target);
      })();
    </script>
    <title>Embassy of Pakistan Kuwait — Community Welfare Wing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
